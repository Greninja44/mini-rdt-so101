[project]
name = "mini-rdt-so101"
version = "0.2.0"
description = "MiniRDT-SO101: a small vision-conditioned diffusion transformer policy for the SO-101 arm (MuJoCo PickCube)"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=2.0",
  "gymnasium>=1.0",
  "imageio>=2.0",
  "torch>=2.0",
  "torchvision>=0.15",
  "matplotlib>=3.7",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulation", "data", "evaluation", "models", "training"]
